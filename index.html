<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בר מצווה - תמם יהונתן</title>

    <!-- גופנים -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0f2b4e;
            --accent-color: #d4af37;
            --bg-color: #fcf9f2;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d4af3720 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(15, 43, 78, 0.1);
            animation: slideUp 0.8s ease-out;
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Assistant', sans-serif;
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .event-details {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .hebrew-date {
            font-size: 0.95rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .invitation-wrapper {
            position: relative;
            margin-bottom: 25px;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 4px solid #fff;
            min-height: 200px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .invitation-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-placeholder-text {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        .countdown-title {
            text-align: center;
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            text-align: center;
            direction: ltr;
        }

        .countdown-item {
            background: var(--primary-color);
            color: white;
            padding: 8px 5px;
            border-radius: 8px;
            min-width: 60px;
            box-shadow: 0 4px 10px rgba(15, 43, 78, 0.2);
        }

        .countdown-number {
            display: block;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            line-height: 1;
            margin-bottom: 2px;
        }

        .countdown-label {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn svg {
            width: 22px;
            height: 22px;
        }

        .btn-calendar {
            background: linear-gradient(135deg, var(--accent-color), #b8963c);
            color: white;
            box-shadow: 0 4px 15px rgba(197, 160, 70, 0.3);
        }

        .btn-calendar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(197, 160, 70, 0.4);
        }

        .btn-nav {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-nav:hover {
            background: var(--primary-color);
            color: white;
        }

        /* Touch-friendly interactions */
        @media (hover: none) {
            .btn-calendar:active {
                transform: scale(0.98);
                box-shadow: 0 2px 10px rgba(197, 160, 70, 0.3);
            }

            .btn-nav:active {
                background: var(--primary-color);
                color: white;
            }

            .btn-calendar:hover,
            .btn-nav:hover {
                transform: none;
                box-shadow: 0 4px 15px rgba(197, 160, 70, 0.3);
            }
        }

        /* Smooth touch scrolling */
        html {
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        /* Prevent text selection on buttons */
        .btn {
            -webkit-user-select: none;
            user-select: none;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }

        /* Tablet */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .container {
                max-width: 100%;
                padding: 20px;
                border-radius: 16px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .event-details {
                font-size: 1rem;
            }

            .btn {
                padding: 14px;
                font-size: 1rem;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 8px;
                align-items: flex-start;
                padding-top: 10px;
            }

            .container {
                padding: 15px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.35rem;
                line-height: 1.3;
            }

            .event-details {
                font-size: 0.95rem;
            }

            .hebrew-date {
                font-size: 0.85rem;
            }

            .invitation-wrapper {
                margin-bottom: 20px;
                margin-top: 12px;
                border-radius: 10px;
                border-width: 3px;
            }

            .countdown-title {
                font-size: 0.85rem;
                margin-bottom: 8px;
            }

            .countdown-container {
                gap: 6px;
                margin-bottom: 20px;
            }

            .countdown-item {
                min-width: 52px;
                padding: 6px 4px;
                border-radius: 6px;
            }

            .countdown-number {
                font-size: 1.2rem;
            }

            .countdown-label {
                font-size: 0.65rem;
            }

            .buttons {
                gap: 10px;
            }

            .btn {
                padding: 12px;
                font-size: 0.95rem;
                gap: 10px;
                border-radius: 40px;
            }

            .btn svg {
                width: 20px;
                height: 20px;
            }

            .footer {
                margin-top: 20px;
                font-size: 0.85rem;
            }
        }

        /* Very small phones */
        @media (max-width: 360px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
            }

            h1 {
                font-size: 1.2rem;
            }

            .event-details {
                font-size: 0.9rem;
            }

            .countdown-item {
                min-width: 45px;
                padding: 5px 3px;
            }

            .countdown-number {
                font-size: 1.1rem;
            }

            .countdown-label {
                font-size: 0.6rem;
            }

            .btn {
                padding: 11px;
                font-size: 0.9rem;
            }
        }

        /* Landscape mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            header {
                margin-bottom: 10px;
            }

            .invitation-wrapper {
                max-height: 200px;
                margin-bottom: 15px;
                margin-top: 10px;
            }

            .invitation-image {
                object-fit: contain;
                max-height: 200px;
            }

            .countdown-container {
                margin-bottom: 15px;
            }

            .buttons {
                gap: 8px;
            }

            .btn {
                padding: 10px;
            }

            .footer {
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>יהונתן תמם חוגג בר מצווה</h1>
            <div class="event-details">יום שני | 5.1.2026 | 09:30</div>
            <div class="hebrew-date">ט"ו בטבת תשפ"ו</div>
        </header>

        <div class="invitation-wrapper">
            <img
                src="1765558183575.jpg"
                alt="הזמנה לבר מצווה - תמם יהונתן"
                class="invitation-image"
                onerror="this.style.display='none'; document.getElementById('error-msg').style.display='block';"
            >
            <div id="error-msg" class="image-placeholder-text">
                <strong>התמונה לא נמצאה</strong><br>
                נא לוודא שקובץ התמונה נמצא באותה תיקייה
            </div>
        </div>

        <div class="countdown-title">ניפגש בעוד:</div>
        <div class="countdown-container" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">0</span>
                <span class="countdown-label">ימים</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">0</span>
                <span class="countdown-label">שעות</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">0</span>
                <span class="countdown-label">דקות</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">0</span>
                <span class="countdown-label">שניות</span>
            </div>
        </div>

        <div class="buttons">
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=%D7%A2%D7%9C%D7%99%D7%99%D7%AA%20%D7%91%D7%A8%20%D7%9E%D7%A6%D7%95%D7%95%D7%94%20-%20%D7%AA%D7%9E%D7%9D%20%D7%99%D7%94%D7%95%D7%A0%D7%AA%D7%9F&dates=20260105T093000/20260105T110000&location=%D7%91%D7%99%D7%AA%20%D7%9B%D7%A0%D7%A1%D7%AA%20%D7%A0%D7%AA%D7%99%D7%91%20%D7%94%D7%A9%D7%9C%D7%95%D7%9D%2C%20%D7%A2%D7%95%D7%9E%D7%A8&ctz=Asia/Jerusalem" target="_blank" class="btn btn-calendar">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                הוספה ליומן
            </a>

            <a href="https://maps.app.goo.gl/JEDx4bYFFbysJs9U9" target="_blank" class="btn btn-nav">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                ניווט לבית הכנסת
            </a>
        </div>

        <div class="footer">
            נשמח לראותכם! משפחת תמם
        </div>
    </div>

    <script>
        const targetDate = new Date('January 5, 2026 09:30:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = '<div style="font-weight:bold; color:var(--primary-color); font-size:1.2rem">מזל טוב!</div>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
